name: Deploy server to DigitalOcean

on:
  push:
    branches: ['main']
    paths:
      - 'server/**'
      - '.github/workflows/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sleeptrackly-api:latest
          build-args: |
            POSTGRES_URI=${{ secrets.POSTGRES_URI }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH Deploy and Migrate
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            mkdir -p ~/app && cd ~/app

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            cat <<'EOF' > .env
            PORT=3000
            NODE_ENV=production
            ${{ secrets.ENV_FILE }}
            POSTGRES_URI=${{ secrets.POSTGRES_URI }}
            EOF

            docker pull ${{ secrets.DOCKER_USERNAME }}/sleeptrackly-api:latest

            docker run --rm \
              --env-file .env \
              ${{ secrets.DOCKER_USERNAME }}/sleeptrackly-api:latest \
              npx prisma migrate deploy
              sh -c "if [ -f dist/src/data-migration-runner.js ]; then node dist/src/data-migration-runner.js; else echo 'No migration script found, skipping...'; fi"

            docker stop nestjs-server || true
            docker rm nestjs-server || true

            docker run -d \
              --name nestjs-server \
              --restart always \
              --env-file .env \
              -e NODE_ENV=production \
              -p 127.0.0.1:3000:3000 \
              ${{ secrets.DOCKER_USERNAME }}/sleeptrackly-api:latest

            docker image prune -f
