services:
  database:
    container_name: sleeptrackly_local_db
    image: postgres:18.1
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - sleeptrackly_network
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    container_name: sleeptrackly_local_redis
    image: redis:8.8
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    networks:
      - sleeptrackly_network

volumes:
  postgres-data:
  redis-data:

networks:
  sleeptrackly_network:
