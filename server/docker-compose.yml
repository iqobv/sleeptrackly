services:
  database:
    container_name: sleep_tracker_db
    image: postgres
    restart: always
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - sleep_tracker_network
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    container_name: sleep_tracker_redis
    image: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '6380:6379'
    networks:
      - sleep_tracker_network
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:

networks:
  sleep_tracker_network:
